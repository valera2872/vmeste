name: Validate web MVP

on:
  push:
    branches:
      - agent/web-mvp-foundation
    paths:
      - "web/**"
      - ".github/workflows/web-mvp.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

# Retry after GitHub Actions recovery on 2026-08-07.
