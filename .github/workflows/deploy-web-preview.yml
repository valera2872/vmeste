name: Deploy web MVP preview

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web MVP branch
        uses: actions/checkout@v4
        with:
          ref: agent/web-mvp-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployment and write status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          mkdir -p docs
          HTTP_RESULT="not_checked"
          CABINET_RESULT="not_checked"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            HTTP_RESULT="http_failure"
            CABINET_RESULT="http_failure"
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 15 https://valera2872.github.io/vmeste/ -o /tmp/vmeste-preview.html; then
                if grep -q "Важно не только знать" /tmp/vmeste-preview.html; then
                  HTTP_RESULT="success"
                else
                  HTTP_RESULT="unexpected_content"
                fi
              fi

              if curl -fsS --max-time 15 https://valera2872.github.io/vmeste/cabinet/ -o /tmp/vmeste-cabinet.html; then
                if grep -q "Загружаем ваше пространство" /tmp/vmeste-cabinet.html; then
                  CABINET_RESULT="success"
                else
                  CABINET_RESULT="unexpected_content"
                fi
              fi

              if [ "$HTTP_RESULT" = "success" ] && [ "$CABINET_RESULT" = "success" ]; then
                break
              fi
              sleep 5
            done
          fi

          cat > docs/WEB_PREVIEW_DEPLOYMENT_STATUS.md <<EOF
          # Web preview deployment status

          - Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Build: $BUILD_RESULT
          - Deploy: $DEPLOY_RESULT
          - Landing HTTP/content check: $HTTP_RESULT
          - Cabinet route check: $CABINET_RESULT
          - Expected URL: https://valera2872.github.io/vmeste/
          - Cabinet URL: https://valera2872.github.io/vmeste/cabinet/
          - Web source branch: agent/web-mvp-foundation
          EOF

      - name: Commit deployment status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_PREVIEW_DEPLOYMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record web preview deployment status"
            git push origin main
          fi

# Deployment trigger: guided cabinet with isolated production concurrency.
