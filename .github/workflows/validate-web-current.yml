name: Validate current web branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-web-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current web branch
        uses: actions/checkout@v4
        with:
          ref: agent/web-mvp-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Production build
        working-directory: web
        run: npm run build

  report:
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write validation status
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          cat > docs/WEB_CURRENT_VALIDATION_STATUS.md <<EOF
          # Current web validation status

          - Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Workflow run ID: $WORKFLOW_RUN_ID
          - Workflow commit: $WORKFLOW_SHA
          - Web source branch: agent/web-mvp-foundation
          - Web source head at trigger: e7f2bc377e743bd3effbaff1b31be5e2a8e4c245
          - Typecheck and production build: $VALIDATE_RESULT
          EOF

      - name: Commit validation status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_CURRENT_VALIDATION_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record current web validation status"
            git push origin main
          fi

# Clean validation trigger after service recovery.
